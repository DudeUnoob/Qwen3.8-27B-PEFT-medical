# Runs on every pull request as github-actions[bot].
# Uses GitHub-hosted runners only. Does not call Cursor, Modal, or a model API.
name: Pull request checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project extras
        run: python -m pip install -e ".[web,bench,test]"
      - name: Run tests
        run: python -m pytest -q
